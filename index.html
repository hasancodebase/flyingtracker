<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlyingTracker — Live</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{ --bg:#0b111e; --panel:#111a2e; --border:#1e2d50; --accent:#00d9ff; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:#e2e8f0;font-family:monospace;overflow:hidden}
  #map{position:absolute;inset:0;top:56px}
  header{height:56px;background:#0b111e;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;position:relative}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800}
  .dot{width:10px;height:10px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .badge{background:var(--accent);color:#000;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800}
  .stats{display:flex;gap:10px}
  .stat{background:var(--panel);border:1px solid var(--border);padding:5px 10px;border-radius:8px;font-size:12px}
  #sidebar{position:absolute;left:10px;top:66px;bottom:10px;width:320px;background:rgba(17,26,46,0.9);border:1px solid var(--border);border-radius:12px;z-index:5;display:flex;flex-direction:column}
  #search{margin:10px;padding:8px 12px;background:#0b111e;border:1px solid var(--border);border-radius:8px;color:#fff}
  #flightList{flex:1;overflow:auto;padding:0 8px 8px;font-size:12px}
  .flight{padding:8px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;margin-bottom:4px}
  .flight:hover{background:#1a2747}
  #detail{position:absolute;right:10px;top:66px;width:300px;background:#111a2e;border:1px solid var(--border);border-radius:12px;padding:12px;z-index:5;display:none}
  #detail.show{display:block}
  .plane{width:20px;height:20px;background:#00d9ff;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="dot"></div> FLYINGTRACKER <span class="badge">LIVE</span></div>
  <div class="stats">
    <div class="stat"><b id="planeCount">0</b> planes</div>
    <div class="stat" id="apiStatus">CONNECTING...</div>
  </div>
</header>
<div id="map"></div>
<div id="sidebar">
  <input id="search" placeholder="Search PIA, EK..." />
  <div id="flightList">Loading planes...</div>
</div>
<div id="detail">
  <div style="display:flex;justify-content:space-between"><b id="d_callsign">-</b><span onclick="detail.classList.remove('show')" style="cursor:pointer">✕</span></div>
  <div style="margin-top:8px;font-size:12px;line-height:1.8">
    Alt: <b id="d_alt">-</b><br>
    Speed: <b id="d_spd">-</b><br>
    Pos: <b id="d_pos">-</b>
  </div>
</div>
<script>
// FIXED MAP - OpenFreeMap is 100% free, no key needed
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [67.0011, 24.8607],
  zoom: 4
});
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

let planes = new Map();
let markers = new Map();

async function fetchLive(){
  try{
    document.getElementById('apiStatus').textContent = 'LOADING...';
    // Direct fetch, no /api needed - ADSB.lol allows CORS
    const res = await fetch('/api/live', {cache:'no-store'});
    const data = await res.json();
    const ac = data.ac || [];
    document.getElementById('planeCount').textContent = ac.length;
    document.getElementById('apiStatus').textContent = 'LIVE';
    document.getElementById('apiStatus').style.color = '#22c55e';
    
    const seen = new Set();
    ac.forEach(p=>{
      if(!p.lat || !p.lon || !p.hex) return;
      seen.add(p.hex);
      planes.set(p.hex, p);
      let m = markers.get(p.hex);
      const el = document.createElement('div');
      el.className = 'plane';
      el.textContent = '✈';
      if(!m){
        m = new maplibregl.Marker({element: el}).setLngLat([p.lon, p.lat]).addTo(map);
        m.getElement().addEventListener('click', ()=> showDetail(p.hex));
        markers.set(p.hex, m);
      }else{
        m.setLngLat([p.lon, p.lat]);
      }
    });
    markers.forEach((m,id)=>{ if(!seen.has(id)){ m.remove(); markers.delete(id); planes.delete(id);} });
    renderList();
  }catch(e){
    console.error(e);
    document.getElementById('apiStatus').textContent = 'ERROR: '+e.message;
    document.getElementById('flightList').textContent = 'API Error, retrying... '+e.message;
  }
}

function renderList(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  const list = document.getElementById('flightList');
  const arr = Array.from(planes.values()).filter(p=>{
    if(!q) return true;
    return (p.flight||'').toLowerCase().includes(q) || (p.hex||'').toLowerCase().includes(q);
  }).slice(0,100);
  
  if(arr.length===0){ list.innerHTML = 'No planes match "'+q+'" - try empty search'; return; }
  
  list.innerHTML = arr.map(p=>`
    <div class="flight" onclick="showDetail('${p.hex}')">
      <span>${(p.flight||'').trim()||p.hex} </span>
      <span style="color:#00d9ff">${p.alt_baro||'GND'}</span>
    </div>
  `).join('');
}

window.showDetail = (hex)=>{
  const p = planes.get(hex);
  if(!p) return;
  document.getElementById('detail').classList.add('show');
  document.getElementById('d_callsign').textContent = (p.flight||'').trim()||hex;
  document.getElementById('d_alt').textContent = (p.alt_baro||'Ground')+' ft';
  document.getElementById('d_spd').textContent = (p.gs?Math.round(p.gs)+' kts':'-');
  document.getElementById('d_pos').textContent = p.lat.toFixed(2)+','+p.lon.toFixed(2);
  map.flyTo({center:[p.lon,p.lat], zoom:6});
}

document.getElementById('search').addEventListener('input', renderList);

// CRITICAL FIX: Call immediately, don't wait for map load!
fetchLive();
setInterval(fetchLive, 5000);
map.on('load', ()=> console.log('Map loaded'));
map.on('error', (e)=> console.log('Map error', e));
</script>
</body>
</html>
