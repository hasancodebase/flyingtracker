<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlyingTracker — Mil + Civil Live</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{ --bg:#0b111e; --panel:#111a2e; --border:#1e2d50; --accent:#00d9ff; --mil:#ef4444; --pia:#22c55e; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:#e2e8f0;font-family:monospace;overflow:hidden}
  #map{position:absolute;inset:0;top:56px;background:#0a0f1e}
  header{height:56px;background:#0b111e;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;position:relative}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800}
  .dot{width:10px;height:10px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .badge{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800;color:#000}
  .badge.live{background:var(--accent)} .badge.mil{background:var(--mil);color:#fff}
  .stats{display:flex;gap:8px;align-items:center}
  .stat{background:var(--panel);border:1px solid var(--border);padding:5px 10px;border-radius:8px;font-size:12px}
  .filter{cursor:pointer} .filter.active{border-color:var(--accent);color:var(--accent)}
  #sidebar{position:absolute;left:10px;top:66px;bottom:10px;width:360px;background:rgba(17,26,46,0.95);border:1px solid var(--border);border-radius:12px;z-index:5;display:flex;flex-direction:column}
  #search{margin:10px;padding:8px 12px;background:#0b111e;border:1px solid var(--border);border-radius:8px;color:#fff}
  #flightList{flex:1;overflow:auto;padding:0 8px 8px;font-size:12px}
  .flight{padding:8px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;margin-bottom:4px;border-left:3px solid transparent}
  .flight:hover{background:#1a2747} .flight.mil{border-left-color:var(--mil)} .flight.pia{border-left-color:var(--pia)}
  #detail{position:absolute;right:10px;top:66px;width:320px;background:#111a2e;border:1px solid var(--border);border-radius:12px;padding:12px;z-index:5;display:none}
  #detail.show{display:block}
  /* AIRCRAFT ICON - NOT DOT */
  .plane{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;filter:drop-shadow(0 0 4px currentColor);transition:transform 0.5s}
  .plane.mil{color:var(--mil)} .plane.civil{color:var(--accent)} .plane.pia{color:var(--pia);font-size:26px;filter:drop-shadow(0 0 6px #22c55e)}
  .legend{position:absolute;bottom:20px;left:380px;z-index:5;background:rgba(17,26,46,0.9);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;display:flex;gap:12px}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="dot"></div> FLYINGTRACKER <span class="badge live">LIVE</span> <span class="badge mil">MIL+CIVIL</span></div>
  <div class="stats">
    <div class="stat"><b id="planeCount">0</b> planes</div>
    <div class="stat filter active" id="f_all" onclick="setFilter('all')">ALL</div>
    <div class="stat filter" id="f_mil" onclick="setFilter('mil')">🔴 MIL</div>
    <div class="stat filter" id="f_civil" onclick="setFilter('civil')">🔵 CIVIL</div>
    <div class="stat filter" id="f_pia" onclick="setFilter('pia')">🟢 PIA</div>
    <div class="stat" id="apiStatus">CONNECTING...</div>
  </div>
</header>
<div id="map"></div>
<div id="sidebar">
  <input id="search" placeholder="Search PIA, RCH, EK..." />
  <div id="flightList">Loading worldwide aircrafts...</div>
</div>
<div id="detail">
  <div style="display:flex;justify-content:space-between"><b id="d_callsign">-</b><span onclick="document.getElementById('detail').classList.remove('show')" style="cursor:pointer">✕</span></div>
  <div style="margin-top:8px;font-size:12px;line-height:1.8">
    <div id="d_type" style="font-weight:800"></div>
    Flight: <b id="d_flight">-</b><br>
    Alt: <b id="d_alt">-</b><br>
    Speed: <b id="d_spd">-</b><br>
    Heading: <b id="d_head">-</b><br>
    Pos: <b id="d_pos">-</b>
  </div>
</div>
<div class="legend">
  <span>✈ Military</span>
  <span>✈ Civil</span>
  <span style="color:#22c55e">✈ PIA</span>
</div>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://demotiles.maplibre.org/style.json',
  center: [67, 24],
  zoom: 2
});
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

let planes = new Map();
let markers = new Map();
let filter = 'all';

window.setFilter = (f)=>{
  filter = f;
  document.querySelectorAll('.filter').forEach(el=> el.classList.remove('active'));
  document.getElementById('f_'+f).classList.add('active');
  renderList();
  markers.forEach((m,hex)=>{
    const p = planes.get(hex);
    m.getElement().style.display = shouldShow(p) ? 'flex' : 'none';
  });
}

function isMil(p){ const f=(p.flight||'').toUpperCase(); return f.startsWith('RCH')||f.startsWith('CNV')||f.includes('COBRA')||f.startsWith('G7')||p.type==='mil'; }
function isPIA(p){ return (p.flight||'').toUpperCase().includes('PIA')||(p.flight||'').toUpperCase().includes('PK'); }
function shouldShow(p){
  if(!p) return false;
  if(filter==='all') return true;
  if(filter==='mil') return p.type==='mil';
  if(filter==='civil') return p.type==='civil';
  if(filter==='pia') return isPIA(p);
  return true;
}

async function fetchLive(){
  try{
    document.getElementById('apiStatus').textContent = 'LOADING...';
    let all = [];

    try{
      const res = await fetch('https://opensky-network.org/api/states/all', {cache:'no-store'});
      const j = await res.json();
      if(j.states){
        j.states.forEach(s=>{
          if(s[5] && s[6]){
            all.push({hex:s[0], flight:(s[1]||'').trim(), lon:s[5], lat:s[6], alt_baro:Math.round(s[7]||0), gs:s[9], track:s[10], type:'civil'});
          }
        });
      }
    }catch(e){}

    try{
      const proxy = 'https://api.allorigins.win/raw?url='+encodeURIComponent('https://api.adsb.lol/v2/mil');
      const res = await fetch(proxy, {cache:'no-store'});
      const txt = await res.text();
      if(!txt.startsWith('<')){
        const j = JSON.parse(txt);
        if(j.ac){
          j.ac.forEach(p=>{
            if(p.hex && p.lat && p.lon){
              all.push({hex:p.hex, flight:(p.flight||'').trim(), lon:p.lon, lat:p.lat, alt_baro:p.alt_baro||0, gs:p.gs, track:p.track||p.true_heading, type:'mil', mil:true});
            }
          });
        }
      }
    }catch(e){}

    if(all.length===0) throw new Error('no data');
    const mapByHex = new Map();
    all.forEach(p=> mapByHex.set(p.hex, p));
    let ac = Array.from(mapByHex.values());
    ac.sort((a,b)=>{
      if(isPIA(a)&&!isPIA(b)) return -1;
      if(!isPIA(a)&&isPIA(b)) return 1;
      if(a.type==='mil'&&b.type!=='mil') return -1;
      if(a.type!=='mil'&&b.type==='mil') return 1;
      return 0;
    });
    ac = ac.slice(0, 2500);

    document.getElementById('planeCount').textContent = mapByHex.size;
    document.getElementById('apiStatus').textContent = 'LIVE • '+ac.filter(p=>p.type==='mil').length+' MIL';
    document.getElementById('apiStatus').style.color = '#22c55e';

    const seen = new Set();
    ac.forEach(p=>{
      seen.add(p.hex);
      planes.set(p.hex, p);
      let m = markers.get(p.hex);
      const el = document.createElement('div');
      let cls = 'plane ';
      if(isPIA(p)) cls+='pia';
      else if(p.type==='mil') cls+='mil';
      else cls+='civil';
      el.className = cls;
      el.textContent = '✈';
      el.style.transform = `rotate(${(p.track||0)-45}deg)`;
      el.title = p.flight||p.hex;
      if(!m){
        m = new maplibregl.Marker({element: el}).setLngLat([p.lon, p.lat]).addTo(map);
        m.getElement().addEventListener('click', ()=> showDetail(p.hex));
        markers.set(p.hex, m);
      }else{
        m.setLngLat([p.lon, p.lat]);
        m.getElement().className = cls;
        m.getElement().textContent = '✈';
        m.getElement().style.transform = `rotate(${(p.track||0)-45}deg)`;
      }
      m.getElement().style.display = shouldShow(p) ? 'flex' : 'none';
    });

    markers.forEach((m,id)=>{ if(!seen.has(id)){ m.remove(); markers.delete(id); planes.delete(id);} });
    renderList();
  }catch(e){
    document.getElementById('apiStatus').textContent = 'RETRYING...';
    setTimeout(fetchLive, 3000);
  }
}

function renderList(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  const list = document.getElementById('flightList');
  let arr = Array.from(planes.values()).filter(shouldShow);
  if(q){ arr = arr.filter(p=> (p.flight||'').toLowerCase().includes(q) || (p.hex||'').toLowerCase().includes(q)); }
  arr = arr.slice(0,300);
  list.innerHTML = arr.map(p=>`
    <div class="flight ${p.type==='mil'?'mil':''} ${isPIA(p)?'pia':''}" onclick="showDetail('${p.hex}')">
      <span>✈ ${p.flight||p.hex}</span>
      <span style="color:${p.type==='mil'?'#ef4444':'#00d9ff'}">${p.alt_baro||'GND'}</span>
    </div>
  `).join('') || 'No planes - click ALL';
}

window.showDetail = (hex)=>{
  const p = planes.get(hex); if(!p) return;
  document.getElementById('detail').classList.add('show');
  document.getElementById('d_callsign').textContent = p.flight||hex;
  document.getElementById('d_type').textContent = p.type==='mil'?'🔴 MILITARY': isPIA(p)?'🟢 PIA':'🔵 CIVIL';
  document.getElementById('d_type').style.color = p.type==='mil'?'#ef4444': isPIA(p)?'#22c55e':'#00d9ff';
  document.getElementById('d_flight').textContent = p.flight||'-';
  document.getElementById('d_alt').textContent = (p.alt_baro||0)+' ft';
  document.getElementById('d_spd').textContent = (p.gs?Math.round(p.gs)+' kts':'-');
  document.getElementById('d_head').textContent = (p.track?Math.round(p.track)+'°':'-');
  document.getElementById('d_pos').textContent = p.lat.toFixed(3)+','+p.lon.toFixed(3);
  map.flyTo({center:[p.lon,p.lat], zoom:5});
}

document.getElementById('search').addEventListener('input', renderList);
fetchLive();
setInterval(fetchLive, 10000);
</script>
</body>
</html>
