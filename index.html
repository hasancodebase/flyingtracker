<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlyingTracker — Live Flight Radar 24/7</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{ --bg:#0b111e; --panel:#111a2e; --border:#1e2d50; --accent:#00d9ff; --accent2:#7c3aed; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:#e2e8f0;font-family:ui-monospace,monospace;overflow:hidden}
  #map{position:absolute;inset:0;top:56px;bottom:0}
  header{height:56px;background:rgba(11,17,30,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative;z-index:10}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800}
  .logo-dot{width:10px;height:10px;background:#22c55e;border-radius:50%;box-shadow:0 0 12px #22c55e;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.5}}
  .badge{background:linear-gradient(90deg,var(--accent),var(--accent2));padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#000}
  .stats{display:flex;gap:12px;align-items:center}
  .stat{background:var(--panel);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-size:12px}
  .stat b{color:var(--accent)}
  #sidebar{position:absolute;left:12px;top:68px;bottom:12px;width:340px;background:rgba(17,26,46,0.92);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;z-index:5;display:flex;flex-direction:column;overflow:hidden}
  #search{margin:12px;padding:10px 14px;background:#0b111e;border:1px solid var(--border);border-radius:10px;color:#e2e8f0;outline:none}
  #flightList{flex:1;overflow:auto;padding:0 8px 8px}
  .flight{padding:10px 12px;border-radius:10px;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .flight:hover{background:#0f1a30;border-color:var(--border)}
  .flight.active{background:#122040;border-color:var(--accent)}
  .callsign{font-weight:700;color:#fff}
  .meta{font-size:11px;color:#94a3b8}
  .alt{font-size:11px;color:var(--accent)}
  #detail{position:absolute;right:12px;top:68px;width:320px;background:rgba(17,26,46,0.95);border:1px solid var(--border);border-radius:16px;padding:16px;z-index:5;display:none}
  #detail.show{display:block}
  .plane-icon{width:24px;height:24px;background:var(--accent);mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9L2 14v2l8-2.5V21l2 1 2-1v-7.5L21 16z"/></svg>') center/contain no-repeat;-webkit-mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9L2 14v2l8-2.5V21l2 1 2-1v-7.5L21 16z"/></svg>') center/contain no-repeat}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-dot"></div> FLYINGTRACKER <span class="badge">LIVE</span> <span style="font-size:11px;color:#64748b;margin-left:8px">flyingtracker.pages.dev</span></div>
  <div class="stats">
    <div class="stat"><b id="planeCount">0</b> planes</div>
    <div class="stat"><b id="apiStatus">CONNECTING...</b></div>
  </div>
</header>
<div id="map"></div>
<div id="sidebar">
  <input id="search" placeholder="Search callsign, e.g. PIA, EK415..." />
  <div id="flightList"></div>
</div>
<div id="detail">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="callsign" id="d_callsign" style="font-size:18px">-</div>
    <div style="cursor:pointer" onclick="document.getElementById('detail').classList.remove('show')">✕</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px">
    <div><div class="meta">Altitude</div><b id="d_alt">-</b></div>
    <div><div class="meta">Speed</div><b id="d_spd">-</b> kts</div>
    <div><div class="meta">Heading</div><b id="d_h
