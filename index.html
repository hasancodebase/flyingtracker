<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlyingTracker — Mil + Civil Live</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{ --bg:#0b111e; --panel:#111a2e; --border:#1e2d50; --accent:#00d9ff; --mil:#ef4444; --pia:#22c55e; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:#e2e8f0;font-family:monospace;overflow:hidden}
  #map{position:absolute;inset:0;top:56px}
  header{height:56px;background:#0b111e;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;position:relative}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800}
  .dot{width:10px;height:10px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .badge{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800;color:#000}
  .badge.live{background:var(--accent)} .badge.mil{background:var(--mil);color:#fff}
  .stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--border);padding:5px 10px;border-radius:8px;font-size:12px}
  .filter{cursor:pointer} .filter.active{border-color:var(--accent);color:var(--accent)}
  #sidebar{position:absolute;left:10px;top:66px;bottom:10px;width:360px;background:rgba(17,26,46,0.92);border:1px solid var(--border);border-radius:12px;z-index:5;display:flex;flex-direction:column}
  #search{margin:10px;padding:8px 12px;background:#0b111e;border:1px solid var(--border);border-radius:8px;color:#fff}
  #flightList{flex:1;overflow:auto;padding:0 8px 8px;font-size:12px}
  .flight{padding:8px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;margin-bottom:4px;border-left:3px solid transparent}
  .flight:hover{background:#1a2747} .flight.mil{border-left-color:var(--mil)} .flight.pia{border-left-color:var(--pia)}
  #detail{position:absolute;right:10px;top:66px;width:320px;background:#111a2e;border:1px solid var(--border);border-radius:12px;padding:12px;z-index:5;display:none}
  #detail.show{display:block}
  .plane{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 8px currentColor;cursor:pointer}
  .plane.mil{background:var(--mil);color:var(--mil)} .plane.civil{background:var(--accent);color:var(--accent)} .plane.pia{background:var(--pia);color:var(--pia);width:12px;height:12px}
  .legend{position:absolute;bottom:20px;left:380px;z-index:5;background:rgba(17,26,46,0.9);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;display:flex;gap:12px}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="dot"></div> FLYINGTRACKER <span class="badge live">LIVE</span> <span class="badge mil">MIL+CIVIL</span></div>
  <div class="stats">
    <div class="stat"><b id="planeCount">0</b> planes</div>
    <div class="stat filter active" id="f_all" onclick="setFilter('all')">ALL</div>
    <div class="stat filter" id="f_mil" onclick="setFilter('mil')">🔴 MIL</div>
    <div class="stat filter" id="f_civil" onclick="setFilter('civil')">🔵 CIVIL</div>
    <div class="stat filter" id="f_pia" onclick="setFilter('pia')">🟢 PIA</div>
    <div class="stat" id="apiStatus">LOADING...</div>
  </div>
</header>
<div id="map"></div>
<div id="sidebar">
  <input id="search" placeholder="Search PIA, RCH, EK..." />
  <div id="flightList">Loading mil + civil worldwide...</div>
</div>
<div id="detail">
  <div style="display:flex;justify-content:space-between"><b id="d_callsign">-</b><span onclick="document.getElementById('detail').classList.remove('show')" style="cursor:pointer">✕</span></div>
  <div style="margin-top:8px;font-size:12px;line-height:1.8">
    <div id="d_type" style="font-weight:800"></div>
    Flight: <b id="d_flight">-</b><br>
    Alt: <b id="d_alt">-</b><br>
    Speed: <b id="d_spd">-</b><br>
    Hex: <b id="d_hex">-</b><br>
    Pos: <b id="d_pos">-</b>
  </div>
</div>
<div class="legend">
  <span><span style="display:inline-block;width:8px;height:8px;background:#ef4444;border-radius:50%"></span> Military</span>
  <span><span style="display:inline-block;width:8px;height:8px;background:#00d9ff;border-radius:50%"></span> Civil</span>
  <span><span style="display:inline-block;width:10px;height:10px;background:#22c55e;border-radius:50%"></span> PIA</span>
</div>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [67, 24],
  zoom: 3
});
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

let planes = new Map();
let markers = new Map();
let filter = 'all';

window.setFilter = (f)=>{
  filter = f;
  document.querySelectorAll('.filter').forEach(el=> el.classList.remove('active'));
  document.getElementById('f_'+f).classList.add('active');
  renderList();
  markers.forEach((m,hex)=>{
    const p = planes.get(hex);
    const show = shouldShow(p);
    m.getElement().style.display = show ? 'block' : 'none';
  });
}

function isMil(p){
  const f = (p.flight||'').trim().toUpperCase();
  return f.startsWith('RCH') || f.startsWith('CNV') || f.startsWith('G7') || f.startsWith('AE0') || f.startsWith('AE1') || p.mil || f.includes('COBRA') || f.includes('TIGER');
}
function isPIA(p){ return (p.flight||'').toUpperCase().includes('PIA') || (p.flight||'').toUpperCase().includes('PK'); }
function shouldShow(p){
  if(!p) return false;
  if(filter==='all') return true;
  if(filter==='mil') return isMil(p);
  if(filter==='civil') return !isMil(p);
  if(filter==='pia') return isPIA(p);
  return true;
}

async function fetchLive(){
  try{
    document.getElementById('apiStatus').textContent = 'LOADING...';
    let allAc = [];
    
    const endpoints = [
      'https://api.adsb.lol/v2/mil',
      'https://api.adsb.lol/v2/all'
    ];
    
    for(let api of endpoints){
      try{
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(api);
        const res = await fetch(proxyUrl, {cache:'no-store'});
        const txt = await res.text();
        if(txt.trim().startsWith('<')) continue;
        const j = JSON.parse(txt);
        if(j.ac) allAc = allAc.concat(j.ac);
      }catch(e){ console.log('fail', api); }
    }
    
    if(allAc.length === 0) throw new Error('no data');
    
    const mapByHex = new Map();
    allAc.forEach(p=>{ if(p.hex && p.lat && p.lon) mapByHex.set(p.hex, p); });
    let ac = Array.from(mapByHex.values());
    
    ac.sort((a,b)=>{
      if(isPIA(a) && !isPIA(b)) return -1;
      if(!isPIA(a
